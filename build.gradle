plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'skylasliver_creeperphantom'
        }
    }
    mods {
        "skylasliver_creeperphantom" { sourceSet(sourceSets.main) }
    }
}

// 仅在执行 GameTest 时编译并加载集成测试，正式构建不包含测试类。
if (gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('gametest') }) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    sourceSets.main.resources.srcDir 'config-examples'
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

tasks.configureEach {
    if (name in ['runClient', 'runServer', 'runGameTestServer']) {
        dependsOn 'processResources', 'classes'
    }
}

dependencies {
    implementation files('libs/IMBlocker-5.6.1-neoforge+1.20.6-1.21.8.jar')
    implementation files('libs/jei-1.21.1-neoforge-19.57.0.449.jar')
    implementation files('libs/mezz_config-1.21.1-neoforge-0.6.5.jar')
}
