# Gradle 发行包解压目录的基准位置。 / Base location for unpacked Gradle distributions.
distributionBase=GRADLE_USER_HOME
# 发行包相对于基准位置的缓存路径。 / Distribution cache path relative to the base location.
distributionPath=wrapper/dists
# Gradle 发行包地址；由托管构建流程处理下载。 / Gradle distribution URL; downloads are handled by the managed build workflow.
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-9.2.1-bin.zip
# 下载发行包的 SHA-256 校验值。 / SHA-256 checksum for the downloaded distribution.
distributionSha256Sum=72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f
# Wrapper 网络请求超时，单位毫秒。 / Wrapper network request timeout in milliseconds.
networkTimeout=30000
# 启用发行包 URL 验证。 / Enable distribution URL validation.
validateDistributionUrl=true
# 下载 ZIP 缓存的基准位置。 / Base location for cached ZIP downloads.
zipStoreBase=GRADLE_USER_HOME
# ZIP 相对于基准位置的缓存路径。 / ZIP cache path relative to the base location.
zipStorePath=wrapper/dists
